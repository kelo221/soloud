# Builds the shared library with the C API for every platform the build
# scripts cover, tests each build, and keeps the libraries as workflow
# artifacts. Pushing a tag that starts with "v" also publishes them as a
# GitHub release.
name: Build libraries

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        shell: cmd
        run: build_windows.bat
      - name: Smoke test (null driver)
        run: python scripts/smoke_native_lib.py bin/soloud.dll
      - uses: actions/upload-artifact@v7
        with:
          name: soloud-windows-x64
          path: |
            bin/soloud.dll
            lib/soloud.lib
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (Ubuntu 20.04 container)
        run: bash ./build_linux.sh
      - name: Smoke test on Ubuntu 20.04 (null driver)
        run: >-
          docker run --rm -v "$PWD:/src" -e DEBIAN_FRONTEND=noninteractive ubuntu:20.04
          bash -euc "apt-get update -qq && apt-get install -y -qq python3 >/dev/null &&
          python3 /src/scripts/smoke_native_lib.py /src/dist/linux-x64/libsoloud.so"
      - uses: actions/upload-artifact@v7
        with:
          name: soloud-linux-x64
          path: dist/linux-x64/libsoloud.so
          if-no-files-found: error

  macos:
    name: macOS universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: bash ./build_macos.sh
      - name: Check signature and architectures
        run: |
          codesign --verify --verbose dist/macos/libsoloud.dylib
          lipo dist/macos/libsoloud.dylib -verify_arch arm64 x86_64
      - name: Smoke test (null driver)
        run: python3 scripts/smoke_native_lib.py dist/macos/libsoloud.dylib
      - uses: actions/upload-artifact@v7
        with:
          name: soloud-macos-universal
          path: dist/macos/libsoloud.dylib
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build (NDK in an Ubuntu container)
        run: bash ./build_android.sh
      # There is no device to run them on; check they are 16 KiB aligned.
      - name: Check alignment
        run: python3 scripts/elf_info.py --min-align 16384 dist/android/*/libsoloud.so
      - uses: actions/upload-artifact@v7
        with:
          name: soloud-android
          path: dist/android/*/libsoloud.so
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux, macos, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package
        working-directory: artifacts
        run: |
          for dir in soloud-*/; do
            name=${dir%/}
            (cd "$name" && zip -qr "../$name.zip" .)
          done
          sha256sum soloud-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          artifacts/soloud-*.zip artifacts/SHA256SUMS.txt
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME"
          --generate-notes --verify-tag
